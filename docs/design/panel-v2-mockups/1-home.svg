  <rect x="318" y="300" width="660" height="74" rx="6" fill="#1a1206" stroke="#ff8a1c"/>
  <text x="334" y="328" fill="#ffb454" font-size="15" font-weight="bold">★ SIGUIENTE   recommend</text>
  <rect x="900" y="310" width="62" height="26" rx="4" fill="#2a1c0e" stroke="#ff8a1c"/>
  <text x="931" y="328" fill="#ffd166" font-size="14" text-anchor="middle">[ r ]</text>
  <text x="334" y="352" fill="#9aa0a6" font-size="13">Describí qué querés y forge arma el bundle de skills + agentes.</text>
  <!-- quick actions -->
  <text x="318" y="412" fill="#cfd2d6" font-size="15" font-weight="bold">Acciones rápidas</text>
  <text x="318" y="444" font-size="14"><tspan fill="#ffd166">[a]</tspan><tspan fill="#cfd2d6"> audit      </tspan><tspan fill="#27c93f">✓</tspan><tspan fill="#9aa0a6"> revisar config y guardrails</tspan></text>
  <text x="318" y="472" font-size="14"><tspan fill="#ffd166">[d]</tspan><tspan fill="#cfd2d6"> doctor     </tspan><tspan fill="#27c93f">✓</tspan><tspan fill="#9aa0a6"> diagnosticar runtimes / entorno</tspan></text>
  <text x="318" y="500" font-size="14"><tspan fill="#ffd166">[g]</tspan><tspan fill="#cfd2d6"> generate   </tspan><tspan fill="#ff8a1c">↻</tspan><tspan fill="#9aa0a6"> recompilar la config para tus 19 runtimes</tspan></text>
  <text x="318" y="528" font-size="14"><tspan fill="#ffd166">[w]</tspan><tspan fill="#cfd2d6"> wiki       </tspan><tspan fill="#8a8a8a">○</tspan><tspan fill="#9aa0a6"> ingerir docs al wiki del proyecto</tspan></text>
  <text x="318" y="556" font-size="14"><tspan fill="#ffd166">[c]</tspan><tspan fill="#cfd2d6"> catálogo   </tspan><tspan fill="#ff8a1c">⊞</tspan><tspan fill="#9aa0a6"> explorar e instalar (skills / profiles)</tspan></text>
  <text x="318" y="584" font-size="14"><tspan fill="#ffd166">[:]</tspan><tspan fill="#cfd2d6"> comando    </tspan><tspan fill="#ff8a1c">»</tspan><tspan fill="#9aa0a6"> abrir el command palette (correr cualquier cmd)</tspan></text>
  <!-- hint -->
  <text x="318" y="640" fill="#6a6a72" font-size="13">El Home detecta el estado del proyecto y sugiere el siguiente paso.</text>
  <text x="318" y="660" fill="#6a6a72" font-size="13">Si no hubiera project.yaml, destacaría init / adopt en su lugar.</text>
  <!-- footer -->
  <text x="36" y="740" fill="#8a8a8a" font-size="13">[↑↓] Navegar   [Enter] Abrir   [r] recommend   [a] audit   [:] palette   [?] Ayuda   [q] Salir</text>
