name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cli:
    name: CLI tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      # Bun owns dependency resolution (bun.lock); OpenTUI requires Bun >= 1.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node still runs the test suite (node:test) across the support matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile
      - name: Build + run the CLI test suite
        working-directory: packages/cli
        run: bun run build:all && bun run test
