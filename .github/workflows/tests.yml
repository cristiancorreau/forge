name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cli:
    name: CLI tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep running the other matrix legs if one fails — we want to see whether
      # a failure is Windows-specific or universal.
      fail-fast: false
      matrix:
        # windows-latest is the real verifier for the Windows/PowerShell
        # compatibility work (SPEC-035): the panels' interactive OpenTUI render
        # can't be exercised here, but the Node test suite covers the platform
        # logic (Bun resolver, ASCII fallback, paths, hooks) and the
        # non-interactive snapshot end-to-end on a real Windows runner.
        os: [ubuntu-latest, windows-latest]
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      # Bun owns dependency resolution (bun.lock); OpenTUI requires Bun >= 1.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node still runs the test suite (node:test) across the support matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile
      - name: Build + run the CLI test suite
        working-directory: packages/cli
        run: bun run build:all && bun run test

  test-gui:
    name: GUI tests (extension parity + desktop args)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The parity tests (SPEC-072) spawn the real dist/cli.js, so the CLI must
      # be built first from this same checkout (no version skew).
      - name: Build the CLI (for parity)
        working-directory: packages/cli
        run: bun install --frozen-lockfile && bun run build:all
      # VS Code extension: compile (tsc) + run ipc/validation/parity tests (node:test).
      - name: Extension — compile + tests
        working-directory: vscode-extension
        run: npm ci && npm run compile && npm test
      # Electron desktop: only the pure action→args mapping is tested (no Electron run).
      - name: Desktop — args mapping tests
        working-directory: desktop
        run: node --test test/*.test.mjs
