name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cli:
    name: CLI tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    # Un test colgado (visto en Windows con el server MCP) no debe retener el
    # runner las 6h por defecto.
    timeout-minutes: 15
    strategy:
      # Keep running the other matrix legs if one fails — we want to see whether
      # a failure is Windows-specific or universal.
      fail-fast: false
      matrix:
        # windows-latest is the real verifier for the Windows/PowerShell
        # compatibility work (SPEC-035): the panels' interactive OpenTUI render
        # can't be exercised here, but the Node test suite covers the platform
        # logic (Bun resolver, ASCII fallback, paths, hooks) and the
        # non-interactive snapshot end-to-end on a real Windows runner.
        os: [ubuntu-latest, windows-latest]
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      # Bun owns dependency resolution (bun.lock); OpenTUI requires Bun >= 1.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node still runs the test suite (node:test) across the support matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile
      # DIAGNOSTIC (temporary, this PR only): isolate which spec-083 file hangs
      # on Windows. Each file runs alone with a hard step timeout so the job
      # reports instead of eating the whole job budget.
      - name: Build the CLI
        working-directory: packages/cli
        run: bun run build:all
      - name: DIAG spec-083-conformance alone
        if: runner.os == 'Windows'
        working-directory: packages/cli
        timeout-minutes: 4
        continue-on-error: true
        run: node --test test/spec-083-conformance.test.mjs
      - name: DIAG spec-083-mcp-server alone
        if: runner.os == 'Windows'
        working-directory: packages/cli
        timeout-minutes: 4
        continue-on-error: true
        run: node --test test/spec-083-mcp-server.test.mjs
      - name: DIAG mcp-tools alone
        if: runner.os == 'Windows'
        working-directory: packages/cli
        timeout-minutes: 4
        continue-on-error: true
        run: node --test test/mcp-tools.test.mjs
      - name: Run the CLI test suite (with force-exit)
        working-directory: packages/cli
        timeout-minutes: 8
        run: node --test --test-force-exit test/commands.test.mjs test/assets.test.mjs test/hook-spec-gate.test.mjs test/claude-md-specialized.test.mjs test/wiki.test.mjs test/panel.test.mjs test/catalog-install.test.mjs test/windows-compat.test.mjs test/bun-relaunch.test.mjs test/wizard-project-type.test.mjs test/adopt.test.mjs test/more-technologies.test.mjs test/tier2-profiles.test.mjs test/python-sunset.test.mjs test/update.test.mjs test/laravel-skills.test.mjs test/skill-security.test.mjs test/add.test.mjs test/hook-guardrail.test.mjs test/mcp-tools.test.mjs test/i18n.test.mjs test/catalog-unified.test.mjs test/recommend.test.mjs test/marker.test.mjs test/registry.test.mjs test/skill-eval.test.mjs test/meta-skills.test.mjs test/tui-panel-guard.test.mjs test/panel-modes-guard.test.mjs test/panel-actions.test.mjs test/i18n-parity.test.mjs test/panel-commands.test.mjs test/panel-home.test.mjs test/box.test.mjs test/agent-prune.test.mjs test/analyze.test.mjs test/spec-probe.test.mjs test/unit-registry.test.mjs test/state-generator.test.mjs test/gsd-next.test.mjs test/init-from.test.mjs test/commands-gate.test.mjs test/portability.test.mjs test/spec-083-json-contract.test.mjs test/spec-083-conformance.test.mjs test/spec-083-mcp-server.test.mjs

  test-gui:
    name: GUI tests (extension parity + desktop args)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The parity tests (SPEC-072) spawn the real dist/cli.js, so the CLI must
      # be built first from this same checkout (no version skew).
      - name: Build the CLI (for parity)
        working-directory: packages/cli
        run: bun install --frozen-lockfile && bun run build:all
      # VS Code extension: compile (tsc) + run ipc/validation/parity tests (node:test).
      # The extension's package-lock.json is gitignored (the repo pins the CLI via
      # bun.lock), so `npm install` is used instead of `npm ci`.
      - name: Extension — install + compile + tests
        working-directory: vscode-extension
        run: npm install --no-audit --no-fund && npm run compile && npm test
      # Electron desktop: only the pure action→args mapping is tested (no Electron run).
      - name: Desktop — args mapping tests
        working-directory: desktop
        run: node --test test/*.test.mjs

  test-v4-packages:
    name: v4 packages (schemas + daemon-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # packages/schemas: fuente de verdad JSON Schema + artefactos generados.
      # `generate` debe ser idempotente: si el diff no queda limpio, alguien
      # editó *.gen.* a mano o los schemas divergieron (criterio de SPEC-075).
      - name: Schemas — install + generate (idempotencia) + build + tests
        working-directory: packages/schemas
        run: |
          npm install --no-audit --no-fund
          npm run generate
          git diff --exit-code src/
          npm run build
          npm test
      # packages/daemon-core: dominio puro (SPEC-076). El purity test verifica
      # que src/ no importa node:/bun:/sqlite/http; corre sin tmux ni SQLite.
      - name: Daemon-core — install + build + tests
        working-directory: packages/daemon-core
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
