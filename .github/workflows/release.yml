name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

jobs:
  test-cli:
    name: CLI tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      # Bun owns dependency resolution (bun.lock); OpenTUI requires Bun >= 1.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node still runs the test suite (node:test) across the support matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile
      - name: Build + run the CLI test suite
        working-directory: packages/cli
        run: bun run build:all && bun run test

  publish-npm:
    name: Publish to npm
    needs: test-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node provides npm for publishing with provenance (Bun has no equivalent).
      # Node 22 here: npm@latest (needed for OIDC Trusted Publishing) dropped
      # Node 20 support — v3.12.0's publish failed with `notsup` on 20.20.2.
      # Node 20 compatibility is covered by the test matrix, not the publisher.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: Build assets + TypeScript
        working-directory: packages/cli
        run: bun run build:all

      - name: Run CLI tests
        working-directory: packages/cli
        run: bun run test

      - name: Smoke test — pack
        working-directory: packages/cli
        run: |
          npm pack --dry-run
          TARBALL=$(npm pack 2>/dev/null)
          echo "Packed: $TARBALL"

      - name: Smoke test — install and run (npm path)
        working-directory: packages/cli
        run: |
          TARBALL=$(ls *.tgz | head -1)
          mkdir -p /tmp/forge-smoke
          cd /tmp/forge-smoke
          npm install --prefix . $GITHUB_WORKSPACE/packages/cli/$TARBALL
          node node_modules/.bin/forge --version
          node node_modules/.bin/forge --help
          node node_modules/.bin/forge doctor

      - name: Smoke test — global install exposes the `forge` command
        working-directory: packages/cli
        run: |
          TARBALL=$(ls *.tgz | head -1)
          npm install -g "$GITHUB_WORKSPACE/packages/cli/$TARBALL"
          # Run from a clean dir (no project.yaml) so the bare command resolves via its shebang
          # without picking up the repo's own dogfooded project.yaml (doctor would flag a runtime
          # declared active but not installed on the CI runner and exit non-zero).
          cd "$RUNNER_TEMP"
          forge --version
          forge --help >/dev/null
          forge doctor

      # OIDC Trusted Publishing — no long-lived NPM_TOKEN.
      # Requires npm >= 11.5.1; the setup-node runner ships an older npm.
      - name: Upgrade npm (OIDC Trusted Publishing support)
        run: npm install -g npm@latest

      # Authentication is via the workflow's OIDC id-token (permissions: id-token: write
      # above); provenance attestation is automatic. Prerequisite (one-time, maintainer):
      # configure the Trusted Publisher for @cristiancorreau/forge on npmjs.com
      # (Package -> Settings -> Trusted Publisher -> GitHub Actions: owner cristiancorreau,
      # repo forge, workflow release.yml). Until that is set, a token-less publish fails.
      - name: Publish (OIDC, no token)
        working-directory: packages/cli
        run: npm publish --provenance --access public

  # Mirror the npm release as a GitHub Release, using the matching CHANGELOG
  # section as the body. Runs only after a successful npm publish.
  github-release:
    name: GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pull the "## [VERSION]" block from CHANGELOG.md, up to the next "## [".
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { capture=1; print; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for $VERSION; falling back to auto-generated notes." >&2
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi
          echo "----- release notes -----"; cat release-notes.md || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.fallback }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "v${{ steps.notes.outputs.version }}" \
              --generate-notes --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "v${{ steps.notes.outputs.version }}" \
              --notes-file release-notes.md --verify-tag
          fi
