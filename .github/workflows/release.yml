name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

jobs:
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Run tests
        run: pytest tests/ -q --tb=short

  publish-npm:
    name: Publish to npm
    needs: test-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build assets + TypeScript
        working-directory: packages/cli
        run: npm run build:all

      - name: Run CLI parity tests
        working-directory: packages/cli
        run: npm test

      - name: Smoke test — pack
        working-directory: packages/cli
        run: |
          npm pack --dry-run
          TARBALL=$(npm pack 2>/dev/null)
          echo "Packed: $TARBALL"

      - name: Smoke test — install and run
        working-directory: packages/cli
        run: |
          TARBALL=$(ls *.tgz | head -1)
          mkdir -p /tmp/forge-smoke
          cd /tmp/forge-smoke
          npm install --prefix . $GITHUB_WORKSPACE/packages/cli/$TARBALL
          node node_modules/.bin/forge --version
          node node_modules/.bin/forge --help
          node node_modules/.bin/forge doctor

      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
