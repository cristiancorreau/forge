name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'

jobs:
  test-cli:
    name: CLI tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      # Bun owns dependency resolution (bun.lock); OpenTUI requires Bun >= 1.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node still runs the test suite (node:test) across the support matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile
      - name: Build + run the CLI test suite
        working-directory: packages/cli
        run: bun run build:all && bun run test

  publish-npm:
    name: Publish to npm
    needs: test-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node provides npm for publishing with provenance (Bun has no equivalent).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (Bun, frozen lockfile)
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: Build assets + TypeScript
        working-directory: packages/cli
        run: bun run build:all

      - name: Run CLI tests
        working-directory: packages/cli
        run: bun run test

      - name: Smoke test — pack
        working-directory: packages/cli
        run: |
          npm pack --dry-run
          TARBALL=$(npm pack 2>/dev/null)
          echo "Packed: $TARBALL"

      - name: Smoke test — install and run (npm path)
        working-directory: packages/cli
        run: |
          TARBALL=$(ls *.tgz | head -1)
          mkdir -p /tmp/forge-smoke
          cd /tmp/forge-smoke
          npm install --prefix . $GITHUB_WORKSPACE/packages/cli/$TARBALL
          node node_modules/.bin/forge --version
          node node_modules/.bin/forge --help
          node node_modules/.bin/forge doctor

      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
