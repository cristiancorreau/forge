# SPEC-063 — Registro declarativo de capacidades (capability registry).
#
# Cada unidad (agente o skill core) declara un contrato estatico verificable:
#   scope    : ambito de trabajo de la unidad.
#   tools    : conjunto de tools permitidas por el contrato. El frontmatter del
#              agente NO puede declarar tools fuera de este conjunto (drift).
#              Las skills no estan ligadas a tools: la lista queda vacia.
#   outputs  : artefactos/entregables prometidos por la unidad.
#   phase    : metadata declarativa opcional (no hay routing en vivo).
#
# `forge audit` valida, contra este registro:
#   (a) cada unidad tiene su archivo real (.md / SKILL.md) presente;
#   (b) los tools del frontmatter del agente estan dentro de `tools`;
#   (c) parity: no hay agentes/skills en disco ausentes del registro ni viceversa.
#
# Este archivo vive en core/ y build-assets.mjs lo copia a assets/core/.

agents:
  - name: orchestrator
    scope: /
    tools: [Read, Grep, Glob, Bash, Edit, Write, Agent, WebFetch]
    outputs: [plan, descomposicion-de-tareas, delegacion-a-agentes]
    phase: planning

  - name: backend-engineer
    scope: /
    tools: [Read, Grep, Glob, Bash, Edit, Write]
    outputs: [endpoints, esquemas-db, logica-de-negocio]
    phase: implementation

  - name: frontend-engineer
    scope: /
    tools: [Read, Grep, Glob, Bash, Edit, Write]
    outputs: [componentes-ui, paginas, integracion-api]
    phase: implementation

  - name: test-engineer
    scope: /
    tools: [Read, Grep, Glob, Bash, Edit, Write]
    outputs: [tests, fixtures, cobertura]
    phase: verification

  - name: docs-writer
    scope: /
    tools: [Read, Grep, Glob, Bash, Edit, Write]
    outputs: [documentacion, readme, guias]
    phase: documentation

  - name: security-auditor
    scope: /
    tools: [Read, Grep, Glob, Bash]
    outputs: [reporte-de-seguridad, hallazgos]
    phase: review

  - name: compliance-reviewer
    scope: /
    tools: [Read, Grep, Glob, Bash]
    outputs: [reporte-de-compliance, hallazgos]
    phase: review

# Skills core. No estan ligadas a tools (contrato de tools vacio); el registro
# verifica presencia del archivo y parity contra disco, mas outputs prometidos.
