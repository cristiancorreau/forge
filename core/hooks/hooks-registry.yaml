# Forge v2 — Hooks registry
# Define qué hooks se instalan según mode y stack del proyecto.
# Solo se referencian hooks JavaScript puro (.js/.cjs) o shell scripts (.sh):
# sin dependencias de Python. Cada entrada debe tener un archivo real en core/hooks/.

universal:
  # Se instalan en TODOS los proyectos
  - hook: pre-edit-check.js
    event: PreToolUse
    matcher: "Edit|Write"
    description: >-
      Branch guard, debug detection, secret detection y spec gate (issue #28):
      al editar código en una rama feature exige una spec APPROVED en
      docs/specs/. Backward-compatible: advierte por defecto y solo bloquea con
      mode=enterprise + rules.require_spec_before_implementation. Ver
      docs/spec-gate-flow.md.
  - hook: post-turn-check.sh
    event: Stop
    description: "Typecheck/lint sobre archivos modificados"
  - hook: session-start.sh
    event: SessionStart
    description: "Carga project.yaml + estado al iniciar la sesión"
  - hook: precompact-headroom.js
    event: PreCompact
    description: >-
      Antes de que el runtime compacte el contexto, recuerda releer
      .forge/state/STATE.md (SPEC-062) para no perder el panorama. Solo se
      registra en runtimes que exponen el evento PreCompact (claude-code).

standard:
  # mode: standard + enterprise
  - hook: pre-bash-check.js
    event: PreToolUse
    matcher: "Bash"
    description: "Bloquea comandos destructivos en producción"

approvals:
  # Solo si project.yaml declara approvals.enabled: true (SPEC-083 P6 / SPEC-081).
  # forge instala el hook y lo registra; el circuito de aprobación en runtime
  # (daemon, UI, resolución) es de mingako. FAIL-OPEN: sin daemon no bloquea nada.
  # Extensión .cjs a propósito: el hook es CommonJS y en proyectos destino con
  # "type": "module" un .js crashearía antes de correr el circuito.
  - hook: pre-approval-gate.cjs
    event: PreToolUse
    matcher: "Bash|Edit|Write|ExitPlanMode|AskUserQuestion"
    description: >-
      Approval gate fail-open: reenvía la tool call al circuito externo de
      aprobaciones (mingako) descubierto vía ~/.forge/daemon.json (POST
      /api/v1/approvals + long-poll /wait, SPEC-081) y deniega solo ante una
      resolución explícita del daemon (deny, timeout o answer). Sin daemon,
      corrupto o colgado: permite.

# NOTA (issue #23): los hooks de enterprise y por stack (audit-log-append,
# check-destructive-sql, prisma-safety, composer-check) aún no están
# implementados como .js/.sh, por lo que se omiten del registry hasta que
# exista una spec SDD aprobada y su implementación en core/hooks/.
# No agregar referencias a hooks .py: la CLI corre 100% en Node.js.
